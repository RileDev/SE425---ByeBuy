services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: byebuy-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-byebuy_db}
      MYSQL_USER: ${MYSQL_USER:-byebuy_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-byebuy_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - byebuy-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: byebuy-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      PORT: 5000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-byebuy_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-byebuy_pass}
      DB_NAME: ${MYSQL_DATABASE:-byebuy_db}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy
    networks:
      - byebuy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: byebuy-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - byebuy-network

volumes:
  db_data:

networks:
  byebuy-network:
    driver: bridge
